name: Build and attest release assets

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (for example, 1.1.1)
        required: true
        type: string
      commit:
        description: Exact main-branch commit to build
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify provenance source commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "The requested commit must match the workflow commit."
            exit 1
          fi
      - name: Check out the requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify reproducible build and tests
        run: |
          npm ci
          npm run build
          git diff --exit-code -- main.js
          npm test
      - name: Prepare Obsidian plugin files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from shutil import copyfile

          source = Path('.')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          if os.environ['RELEASE_TAG'] != manifest['version']:
              raise SystemExit('Release tag does not match manifest version')
          out = Path('release-assets')
          out.mkdir(exist_ok=True)
          for name in ['main.js', 'manifest.json', 'styles.css']:
              copyfile(source / name, out / name)
          PY
      - name: Attest plugin files
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
      - name: Upload files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/main.js release-assets/manifest.json release-assets/styles.css --repo "$GITHUB_REPOSITORY" --clobber

name: Build and attach release assets

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (for example, 1.0.0)
        required: true
        type: string
      commit:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Build plugin files, ZIP and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copyfile
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path('.')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          tag = os.environ['RELEASE_TAG']
          if tag != manifest['version']:
              raise SystemExit('Release tag does not match manifest version')
          out = Path('release-assets')
          out.mkdir(exist_ok=True)
          plugin_files = ['main.js', 'manifest.json', 'styles.css']
          for name in plugin_files:
              copyfile(source / name, out / name)
          archive_name = 'hellvault-' + manifest['version'] + '.zip'
          with ZipFile(out / archive_name, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in plugin_files + ['LICENSE']:
                  archive.write(source / name, name)
          files = plugin_files + [archive_name]
          (out / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256((out / name).read_bytes()).hexdigest() + '  ' + name + '\n'
              for name in files
          ), encoding='utf-8')
          PY
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
